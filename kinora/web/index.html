<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Kinora</title>
<style>
/* Design tokens (the design notes, section 3). The timeline's old names below alias the new tokens. */
:root{color-scheme:light dark;
  --c-bg:#F5F5F8;--c-surface:#FFFFFF;--c-surface-2:#ECECF2;--c-line:#D9D9E3;--c-line-strong:#8B8CA0;--c-shim:rgba(255,255,255,.6);
  --c-text:#17181F;--c-text-2:#565869;--c-text-3:#666879;
  --c-accent:#4640B8;--c-accent-hover:#38329C;--c-accent-text:#4640B8;--c-accent-soft:#E8E8F8;--c-on-accent:#FFFFFF;
  --c-ok:#1F7A4D;--c-ok-soft:#E6F4EC;--c-warn:#8A5300;--c-warn-soft:#FBF0DC;--c-bad:#B3261E;--c-bad-soft:#FBE9E7;
  --c-on-media:#FFFFFF;   /* text over the video (not theme-dependent) */
  --c-qr:#FFFFFF;   /* the white tile of the QR code (Settings > Other devices): white in both themes so it scans */
  --bg:var(--c-bg);--fg:var(--c-text);--mut:var(--c-text-2);--accent:var(--c-accent);--sel:var(--c-accent);
  --card:var(--c-surface-2);--line:var(--c-line);
  --track:#EEEEF4;--rec:#9FA1B8;--err:var(--c-bad);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;--s-6:24px;--s-7:32px;--s-8:40px;--s-9:56px;
  --r-sm:6px;--r-md:10px;--r-lg:16px;--r-pill:999px;
  --e-1:0 1px 2px rgba(24,22,18,.05),0 4px 16px rgba(24,22,18,.06);
  --t-fast:120ms;--t-base:200ms;--ease:cubic-bezier(.2,0,0,1)}
/* Player spacing and layout (the design notes): gutters, top padding, app bar height, content width, events column, chrome height */
:root{--gut:16px;--pt:var(--s-3);--bar-h:52px;--max:1760px;--side:clamp(320px,26vw,440px);--chrome:328px}
@media(min-width:600px){:root{--gut:var(--s-6);--pt:var(--s-4);--bar-h:56px}}
@media(min-width:960px){:root{--gut:var(--s-7);--pt:var(--s-6)}}
@media(min-width:960px) and (max-width:1279px){:root{--chrome:376px}}
/* Theme: follows the system unless the user picked one (data-theme on <html>: light | dark) */
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-bg:#111218;--c-surface:#1A1B23;--c-surface-2:#23242E;--c-line:#2E303B;--c-line-strong:#6B6F86;--c-shim:rgba(255,255,255,.07);
  --c-text:#ECECF3;--c-text-2:#A6A8B8;--c-text-3:#8D90A2;--c-accent:#635FDB;--c-accent-hover:#746FE8;--c-accent-text:#A9ACFF;--c-accent-soft:#25264D;
  --c-ok:#4CC38A;--c-ok-soft:#15291F;--c-warn:#E8B04B;--c-warn-soft:#2D2413;--c-bad:#F2867E;--c-bad-soft:#2F1A19;--e-1:none;
  --track:var(--c-surface-2);--rec:#5C5F75}}
:root[data-theme="dark"]{color-scheme:dark;--c-bg:#111218;--c-surface:#1A1B23;--c-surface-2:#23242E;--c-line:#2E303B;--c-line-strong:#6B6F86;--c-shim:rgba(255,255,255,.07);
  --c-text:#ECECF3;--c-text-2:#A6A8B8;--c-text-3:#8D90A2;--c-accent:#635FDB;--c-accent-hover:#746FE8;--c-accent-text:#A9ACFF;--c-accent-soft:#25264D;
  --c-ok:#4CC38A;--c-ok-soft:#15291F;--c-warn:#E8B04B;--c-warn-soft:#2D2413;--c-bad:#F2867E;--c-bad-soft:#2F1A19;--e-1:none;
  --track:var(--c-surface-2);--rec:#5C5F75}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--c-bg);color:var(--c-text);font:15px/22px var(--font)}
#app{max-width:none;margin:auto;min-height:100vh}
/* focus ring on every control of the player (and the export dialog) */
#app :focus-visible,dialog :focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
/* the content column: gutters and top/bottom padding from the root variables; main adds no padding of its own */
#cols{max-width:var(--max);margin-inline:auto;padding:var(--pt) var(--gut)}
main{padding:0}
#vwrap{position:relative;background:#000;aspect-ratio:16/9;border-radius:var(--r-lg);overflow:hidden}
video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--c-on-media);
  font-size:14px;text-align:center;padding:16px;pointer-events:none;background:rgba(0,0,0,.35)}
#msg:empty{display:none}
#msg.err{background:rgba(140,25,25,.78);font-weight:600}
#freeze{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none;pointer-events:none}

/* app bar (56px): app mark, Playback, camera switcher, Add camera, overflow menu */
.pb-bar{display:flex;align-items:center;gap:var(--s-3);height:56px;padding-inline:max(var(--gut),calc((100% - var(--max))/2 + var(--gut)));background:var(--c-surface);border-bottom:1px solid var(--c-line)}
.pb-brand{display:flex;align-items:center;gap:var(--s-3);flex:none}
.pb-mark{width:28px;height:28px;display:block;flex:none}
.pb-mk-b{fill:none;stroke:var(--c-text-3);stroke-width:1.75}
.pb-mk-f{fill:var(--c-accent);stroke:none}
.pb-name{font-size:15px;line-height:20px;font-weight:600;white-space:nowrap}
.pb-switch{min-width:0;flex:0 1 auto}
#chips{display:flex;align-items:center;gap:var(--s-2);overflow-x:auto}
.pb-tab{display:inline-flex;align-items:center;gap:var(--s-2);flex:none;height:36px;padding:0 14px;border:1px solid transparent;border-radius:var(--r-md);
  background:transparent;color:var(--c-text-2);font:inherit;font-size:14px;line-height:20px;font-weight:500;white-space:nowrap;cursor:pointer}
.pb-tab:hover{background:var(--c-surface-2);color:var(--c-text)}
.pb-tab.on{background:var(--c-accent-soft);color:var(--c-accent-text);font-weight:600;box-shadow:inset 3px 0 0 var(--c-accent)}
/* status dot from data-s (set by pollStatus); not on cameras that are not set up */
.pb-tab[data-s]:not([aria-disabled="true"])::after{content:"";width:6px;height:6px;border-radius:50%;flex:none;background:var(--c-text-3)}
.pb-tab[data-s="ok"]:not([aria-disabled="true"])::after{background:var(--c-ok)}
.pb-tab[data-s="wait"]:not([aria-disabled="true"])::after{background:var(--c-warn)}
.pb-tab[data-s="bad"]:not([aria-disabled="true"])::after{background:var(--c-bad)}
.pb-tab[aria-disabled="true"]{border:1px dashed var(--c-line-strong);color:var(--c-text-3)}
.pb-setup{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--r-pill);background:var(--c-surface-2);color:var(--c-accent-text);font-size:12px;line-height:16px;font-weight:500}
.pb-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);flex:none;height:36px;padding:0 12px;border:1px solid var(--c-line);border-radius:var(--r-md);
  background:var(--c-surface-2);color:var(--c-text);font:inherit;font-size:14px;line-height:20px;font-weight:600;white-space:nowrap;cursor:pointer}
.pb-btn:hover{border-color:var(--c-text-3)}
.pb-btn.ghost{background:transparent;border-color:transparent;color:var(--c-accent-text)}
.pb-btn.ghost:hover{background:var(--c-accent-soft)}
.pb-btn .pb-ico{width:18px;height:18px}
.pb-icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;flex:none;border:1px solid transparent;border-radius:var(--r-md);
  background:transparent;color:var(--c-text-2);cursor:pointer}
.pb-icon-btn:hover,.pb-icon-btn[aria-expanded="true"]{background:var(--c-surface-2);color:var(--c-text)}
.pb-ico{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.pb-dots{stroke-width:3}
.pb-bar-r{display:flex;align-items:center;gap:var(--s-2);margin-left:auto;flex:none}
.pb-mi{display:flex;align-items:center;width:100%;min-height:40px;padding:0 12px;border:0;border-radius:var(--r-sm);background:transparent;
  color:var(--c-text);font:inherit;font-size:14px;line-height:20px;text-align:left;cursor:pointer}
.pb-mi:hover,.pb-mi:focus-visible{background:var(--c-surface-2)}
.pb-sep{height:1px;margin:4px 0;border:0;background:var(--c-line)}

/* transport bar (56px): mode control, speed (Recorded only), date stepper and Export on the right */
/* transport bar, status line and timeline share one card under the video (12px below it) */
.pb-card{margin-top:var(--s-3);padding:var(--s-4);background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-lg)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-3);min-height:44px;padding:0 0 var(--s-2)}
.pb-seg{display:inline-flex;align-items:center;gap:3px;height:36px;padding:3px;border:1px solid var(--c-line);border-radius:var(--r-md);background:var(--c-surface-2)}
.pb-seg-btn{display:inline-flex;align-items:center;gap:6px;height:30px;min-width:0;padding:0 12px;border:1px solid transparent;border-radius:var(--r-sm);
  background:transparent;color:var(--c-text-2);font:inherit;font-size:14px;line-height:20px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer}
.pb-seg-btn:hover{color:var(--c-text)}
.pb-seg-btn.on,.pb-seg-btn[aria-checked="true"]{background:var(--c-surface);border:1px solid var(--c-line-strong);color:var(--c-text)}
.pb-mode-dot{width:14px;height:14px;flex:none;fill:var(--c-bad);stroke:none}
#live.on .pb-mode-dot{animation:pb-pulse 1.4s ease-in-out infinite}
@keyframes pb-pulse{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){#live.on .pb-mode-dot{animation:none}}
/* speed strip: always laid out; in Live it is muted and does not respond (its tooltip gives the meaning) */
.pb-speed{display:inline-flex;align-items:center;gap:var(--s-2)}
.pb-cap{font-size:12px;line-height:16px;font-weight:500;color:var(--c-text-2)}
/* sound toggle (Live only, shown by app.js paintSound via the hidden attribute) */
.pb-sound{display:inline-flex;align-items:center;justify-content:center;flex:none;width:36px;height:36px;padding:0;border:1px solid var(--c-line);border-radius:var(--r-md);
  background:var(--c-surface-2);color:var(--c-text-2);cursor:pointer}
.pb-sound:hover{color:var(--c-text)}
.pb-sound[aria-pressed="true"]{color:var(--c-text)}
.pb-sound .pb-ico{width:18px;height:18px}
.pb-sound .pb-snd-off{display:none}
.pb-sound[aria-pressed="false"] .pb-snd-on{display:none}
.pb-sound[aria-pressed="false"] .pb-snd-off{display:inline}
/* tooltips (CSS only, from data-tip): shown on hover and on keyboard focus after 300 ms, below the control, never over the video */
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;z-index:20;top:calc(100% + 6px);left:0;width:max-content;max-width:260px;padding:var(--s-2) var(--s-3);
  border:1px solid var(--c-line);border-radius:var(--r-md);background:var(--c-surface);color:var(--c-text);box-shadow:var(--e-1);
  font-size:13px;line-height:18px;font-weight:400;text-align:left;white-space:normal;pointer-events:none;opacity:0;visibility:hidden;
  transition:opacity var(--t-fast) var(--ease),visibility var(--t-fast) var(--ease)}
[data-tip]:hover::after{opacity:1;visibility:visible;transition-delay:300ms}
[data-tip]:focus-visible::after{opacity:1;visibility:visible;transition-delay:300ms}
[data-tip]:has(:focus-visible)::after{opacity:1;visibility:visible;transition-delay:300ms}
#speed.live{opacity:.5}
#speed.live .pb-seg-btn{pointer-events:none}
.tx-r{display:flex;align-items:center;gap:var(--s-3);margin-left:auto}
.date{display:flex;align-items:center;height:36px;border:1px solid var(--c-line);border-radius:var(--r-md);background:var(--c-surface-2);
  font-size:14px;line-height:20px;font-weight:600;font-variant-numeric:tabular-nums}
.date button{height:36px;min-width:36px;padding:0 8px;border:0;border-radius:var(--r-md);background:none;color:var(--c-text-2);font:inherit;font-size:20px;line-height:1;cursor:pointer}
.date button:hover{color:var(--c-text);background:var(--c-surface)}
.date input{position:absolute;opacity:0;pointer-events:none;width:0}
.date .d{min-width:96px;padding:0 6px;text-align:center;cursor:pointer}
/* camera status alert: a strip under the transport bar, above the status line (never over the picture) */
#camstat{display:none;margin:var(--s-2) 0 0;padding:8px 12px;border-radius:var(--r-md);background:var(--c-warn-soft);color:var(--c-warn);font-size:13px;line-height:18px;font-weight:500}
/* status line under the transport bar: 13/18, 8px dot by tone */
.pb-status{display:flex;align-items:center;gap:var(--s-2);min-height:20px;margin:0;font-size:13px;line-height:18px;color:var(--c-text-2)}
.pb-status::before{content:"";width:8px;height:8px;border-radius:50%;flex:none;background:var(--c-text-3)}
.pb-status.t-ok::before{background:var(--c-ok)}
.pb-status.t-warn::before{background:var(--c-warn)}
.pb-status.t-bad::before{background:var(--c-bad)}
.pb-status.t-accent::before{background:var(--c-accent)}

#tlwrap{position:relative;margin-top:var(--s-2);padding-top:0;touch-action:none;user-select:none}
#bubble{position:absolute;top:3px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:6px;
  padding:3px 9px;font-size:12px;line-height:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;
  pointer-events:none;z-index:2}
#bubble:after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--fg);border-bottom:0}
#cv{width:100%;height:96px;display:block;cursor:grab}
#cv:active{cursor:grabbing}
#head{position:absolute;left:50%;top:40px;bottom:0;width:2px;background:var(--fg);transform:translateX(-1px);pointer-events:none}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.exp-note{margin-top:6px;color:var(--c-text-2)}
#ptz{display:none;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(2,30px);gap:3px}
#ptz button{border:1px solid var(--c-line);background:var(--c-surface-2);color:var(--c-text);border-radius:var(--r-sm);cursor:pointer;font-size:13px;padding:0;touch-action:none;user-select:none}
#ptz button:active{background:var(--c-accent);color:var(--c-on-accent)}
#ptz [data-d=up]{grid-column:2;grid-row:1}
#ptz [data-d=left]{grid-column:1;grid-row:2}
#ptz [data-d=down]{grid-column:2;grid-row:3}
#ptz [data-d=right]{grid-column:3;grid-row:2}
#ptz .c{grid-column:2;grid-row:2;border-radius:50%;background:rgba(255,255,255,.28);margin:9px;pointer-events:none}
#ptzmsg{color:var(--err);font-size:12px;max-width:220px}
#ptzmsg.info{color:var(--c-text-2)}
dialog{border:1px solid var(--c-line);border-radius:var(--r-lg);background:var(--c-surface);color:var(--c-text);padding:20px;width:min(460px,92vw);box-shadow:var(--e-1)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 14px;font-size:18px}
dialog label{display:block;margin:10px 0 4px;color:var(--c-text-2);font-size:13px}
dialog input,dialog select{width:100%;padding:8px;border:1px solid var(--c-line-strong);border-radius:var(--r-md);background:var(--c-surface);color:var(--c-text);font:inherit}
dialog .row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
dialog .row button{min-height:36px;padding:8px 16px;border-radius:var(--r-md);border:1px solid var(--c-line);background:var(--c-surface-2);color:var(--c-text);font:inherit;cursor:pointer}
dialog .row button.go{background:var(--c-accent);border-color:var(--c-accent);color:var(--c-on-accent)}
#expmsg{margin-top:14px;font-size:14px;min-height:1.3em}
#expbar{width:100%;margin-top:8px;display:none}
#explinks a{display:block;margin-top:6px;color:var(--c-accent-text)}
/* filter chips (32px, pill; pressed = accent soft + accent border) */
.chip{border:1px solid var(--c-line);background:var(--c-surface);color:var(--c-text);padding:8px 16px;border-radius:var(--r-pill);
  font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--c-accent);border-color:var(--c-accent);color:var(--c-on-accent);font-weight:600}
#filters{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 10px}
#filters .chip{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;font-size:13px;font-weight:500}
#filters .chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
#filters .chip.on{background:var(--c-accent-soft);border-color:var(--c-accent);color:var(--c-accent-text)}
#filters .chip span{opacity:.7}
/* Desktop: video + timeline on the left, Detected Events as a scrolling right column. The video is exactly 16:9 at the
   height that fits the screen (--chrome is the height of everything else; 340px where the transport bar wraps). The
   two columns are centred, so the leftover width becomes equal margins on the left and right of the page. */
@media(min-width:960px){
  #cols{display:grid;align-items:start;justify-content:center;
    grid-template-columns:min(calc(100% - var(--side) - var(--s-6)),max(480px,calc((100dvh - var(--chrome))*16/9))) var(--side);column-gap:var(--s-6)}
  #vwrap{width:100%}
  main{position:static}
  /* a card whose top edge is the video's top edge and whose bottom edge is the timeline card's bottom edge: it stretches to the
     left column's height (contain:size keeps its own list from stretching the row) and never grows past the viewport */
  aside{position:sticky;top:var(--pt);align-self:stretch;contain:size;max-height:calc(100dvh - var(--bar-h) - 2*var(--pt));display:flex;flex-direction:column;
    border:1px solid var(--c-line);border-radius:var(--r-lg);background:var(--c-surface);overflow:hidden}
  #evhead{background:var(--c-surface)}
  #evs{flex:1;min-height:0;overflow-y:auto;padding-top:var(--s-3,12px);scroll-padding-top:var(--s-3,12px)}   /* only the list scrolls, so the scrollbar starts below the pinned header */
  .th{width:112px}
}

/* pan/tilt pad: semi-transparent overlay in the video's top-right corner (Live only) */
#vwrap #ptz{position:absolute;top:var(--s-4);right:var(--s-4);z-index:3;width:104px;height:104px;border-radius:50%;opacity:.55;
  transition:opacity .2s;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:0;padding:6px;box-sizing:border-box;
  background:rgba(18,18,18,.42);border:1px solid rgba(255,255,255,.2);box-shadow:0 4px 14px rgba(0,0,0,.28);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#vwrap #ptz:hover,#vwrap #ptz:focus-within,#vwrap #ptz:active{opacity:1}
#vwrap #ptz button{background:transparent;border:0;border-radius:50%;color:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;
  transition:background .12s,transform .08s}
#vwrap #ptz button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#vwrap #ptz button:hover{background:rgba(255,255,255,.16)}
#vwrap #ptz button:active{background:rgba(255,255,255,.4);transform:scale(.9)}
#vwrap #ptz .c{margin:11px;background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
#vwrap #ptzmsg{position:absolute;top:calc(var(--s-4) + 112px);right:var(--s-4);z-index:3;max-width:260px;padding:4px 9px;border-radius:7px;
  background:rgba(140,25,25,.85);color:var(--c-on-media);font-size:12px}
#vwrap #ptzmsg.info{background:rgba(0,0,0,.6);color:var(--c-on-media)}
#vwrap #ptzmsg:empty{display:none}
/* title + type chips stay pinned while the events list scrolls */
#evhead{position:sticky;top:0;z-index:2;background:var(--c-surface);border-bottom:1px solid var(--c-line)}
#evrefresh:hover:not([aria-disabled="true"]){background:var(--c-surface-2);color:var(--c-text)}
#evrefresh svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#evrefresh .ic-load{display:none;animation:evspin .8s linear infinite}
#evrefresh.spin .ic-refresh{display:none}
#evrefresh.spin .ic-load{display:block}
#evrefresh[aria-disabled="true"]{cursor:default}
@keyframes evspin{to{transform:rotate(360deg)}}
.chsk{display:inline-block;height:32px;border-radius:var(--r-pill);background:var(--c-surface-2);animation:evpulse 1.2s ease-in-out infinite}
.evsk{height:72px;margin:0 16px 8px;border-radius:var(--r-md);background:var(--c-surface-2);animation:evpulse 1.2s ease-in-out infinite}
@keyframes evpulse{50%{opacity:.45}}
#evhead #filters{padding-bottom:12px}
/* setup wizard and Settings (static/setup.js). Tokens only (--c-*, --s-*, --r-*). A block sets no outer margin of its
   own: the parent sets the gap (.su-view 20, .su-stack 20 between fields, .su-sec 12, .su-pane-in 32, .su-card-s
   padding 20). Ghost buttons at a start edge hang their padding (--su-pad-x) outside the content box. */
[hidden]{display:none!important}
#setup{position:fixed;inset:0;z-index:20;overflow-x:hidden;overflow-y:auto;background:var(--c-bg);color:var(--c-text);font:15px/22px var(--font)}
#setup button,#setup input,#setup select{font:inherit}
:where(#setup) :where(h1,h2,h3,h4,p,ul,ol,dl,dd,dt){margin:0}
:where(#setup) :where(ul,ol){padding:0;list-style:none}
#setup :focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
#setup [tabindex="-1"]:focus{outline:none}
#setup .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#setup details{margin:0}
#setup summary{cursor:pointer;list-style:none}
#setup summary::-webkit-details-marker{display:none}
@media(prefers-reduced-motion:reduce){#setup *{transition-duration:0s!important;animation-duration:0s!important}}
/* the page: the wizard is one card that grows with its content (no fixed height, no inner scroll); Settings is full width */
#suwrap{box-sizing:border-box;min-width:0;max-width:560px;margin:48px auto;padding:32px;background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-lg);box-shadow:var(--e-1)}
#suwrap.settings{max-width:none;margin:0;padding:0;background:transparent;border:0;border-radius:0;box-shadow:none}
/* header: the wizard's brand; Settings' bar (64px, sticky) with the back button and the title, on the content edge */
.su-top{display:flex;align-items:center;gap:var(--s-3);min-height:28px}
.su-brand{display:flex;align-items:center;gap:var(--s-3);min-width:0}
.su-mark{width:28px;height:28px;flex:none}
.su-mk-b{fill:none;stroke:var(--c-text-3);stroke-width:1.75}
.su-mk-f{fill:var(--c-accent);stroke:none}
.su-appname{font-size:15px;line-height:20px;font-weight:600}
#suwrap.settings .su-top{position:sticky;top:0;z-index:3;height:64px;padding-inline:max(32px,calc((100% - 1120px) / 2 + 32px));background:var(--c-surface);border-bottom:1px solid var(--c-line)}
#suwrap.settings .su-appname{font-size:20px;line-height:28px;font-weight:600}
.su-back.su-done{order:2;margin-inline:auto 0;padding-inline:16px;font-weight:600}
.su-back{--su-pad-x:12px;min-height:36px;font-size:14px;margin-inline-start:calc(-1 * var(--su-pad-x) - 1px)}
/* progress (wizard): caption, then four 4px segments */
#sunav{margin-top:var(--s-5)}
.su-caption{margin:0 0 var(--s-2);font-size:12px;line-height:16px;font-weight:500;color:var(--c-text-2)}
.su-seg-list{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;list-style:none;margin:0;padding:0}
.su-seg{height:4px;border-radius:2px;background:var(--c-line)}
.su-seg.on{background:var(--c-accent)}
/* wizard body: blocks 20 apart; the footer below is sticky to the bottom of the viewport */
#setupmain{min-width:0;margin-top:var(--s-6)}
#suwrap.settings #setupmain{margin-top:0}
.su-view{display:flex;flex-direction:column;gap:var(--s-5);min-width:0}
.su-display{font-size:28px;line-height:34px;font-weight:650;letter-spacing:-.01em}
.su-title{font-size:20px;line-height:26px;font-weight:600}
.su-lead{max-width:60ch;color:var(--c-text-2)}
.su-h3{font-size:15px;line-height:22px;font-weight:600}
.su-name{font-size:17px;line-height:24px;font-weight:600;overflow-wrap:anywhere}
.su-sub,.su-detail,.su-note,.su-meta,.su-reason{font-size:13px;line-height:18px;color:var(--c-text-2)}
.su-foot-note,.su-hold,.su-faint{font-size:13px;line-height:18px;color:var(--c-text-3)}
.su-link{color:var(--c-accent-text);text-decoration:underline}
.su-meta{overflow-wrap:anywhere}
.su-mono{font-family:var(--mono);font-size:14px;line-height:22px}
.su-ok{color:var(--c-ok)}
.su-warn{color:var(--c-warn)}
.su-bad{color:var(--c-bad)}
.su-ico{width:20px;height:20px;flex:none;display:block;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.su-ico.su-ok{color:var(--c-ok)}
.su-ico.su-bad{color:var(--c-bad)}
.su-msg{font-size:14px;line-height:20px;color:var(--c-text-2)}
.su-busy{display:flex;align-items:center;gap:var(--s-2);font-size:14px;line-height:20px;color:var(--c-text)}
.su-spin{display:inline-block;width:16px;height:16px;flex:none;border:2px solid var(--c-line);border-top-color:var(--c-accent);border-radius:50%;animation:su-spin .8s linear infinite}
@keyframes su-spin{to{transform:rotate(360deg)}}
.su-reach{display:flex;align-items:center;gap:var(--s-2);font-size:14px;line-height:20px}
.su-reach.su-ok{color:var(--c-ok)}
.su-reach.su-bad{color:var(--c-bad)}
.su-reach>span{min-width:0;overflow-wrap:anywhere}
/* buttons: 44px, 15/600. Outlined is the default; go is the one primary per screen; ghost is a text action */
.su-btn{--su-pad-x:20px;display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);min-height:44px;min-width:0;margin:0;padding:0 var(--su-pad-x);border:1px solid var(--c-line-strong);border-radius:var(--r-md);background:var(--c-surface);color:var(--c-text);font-size:15px;font-weight:600;line-height:20px;text-align:center;cursor:pointer;transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}
.su-btn:hover:not(:disabled){border-color:var(--c-text-3)}
.su-btn.sm{min-height:36px;--su-pad-x:12px;font-size:14px}
.su-btn.go{background:var(--c-accent);border-color:var(--c-accent);color:var(--c-on-accent)}
.su-btn.go:hover:not(:disabled){background:var(--c-accent-hover);border-color:var(--c-accent-hover)}
.su-btn.ghost{background:transparent;border-color:transparent;color:var(--c-accent-text)}
.su-btn.ghost:hover:not(:disabled){background:var(--c-accent-soft)}
.su-btn.bad{background:var(--c-bad);border-color:var(--c-bad);color:var(--c-on-accent)}
.su-btn.bad-o{background:transparent;border-color:var(--c-bad);color:var(--c-bad)}
.su-btn.bad-o:hover:not(:disabled){background:var(--c-bad-soft)}
.su-btn:disabled{background:var(--c-surface-2);border-color:transparent;color:var(--c-text-3);cursor:not-allowed}
.su-btn.ghost:disabled{background:transparent}
/* ghosts at a start edge hang their padding outside the content edge, so their text lines up with the text beside them */
.su-nav-l>.su-btn,.su-bar>.su-btn.ghost:first-child{margin-inline-start:calc(-1 * var(--su-pad-x) - 1px)}
.su-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2)}
.su-bar-end{justify-content:flex-end}
.su-stack{display:flex;flex-direction:column;gap:var(--s-5);min-width:0}
/* field: label, 6px, input (44px), hint or error line */
.su-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.su-field>label{font-size:14px;line-height:20px;font-weight:500;color:var(--c-text)}
.su-hint{font-size:13px;line-height:18px;color:var(--c-text-2)}
.su-err{font-size:13px;line-height:18px;color:var(--c-bad)}
.su-err:empty{display:none}
#setup :where(input:not([type=radio],[type=checkbox]),select){width:100%;min-width:0;min-height:44px;padding:0 12px;border:1px solid var(--c-line-strong);border-radius:var(--r-md);background:var(--c-surface);color:var(--c-text);font-size:15px;line-height:20px}
#setup input::placeholder{color:var(--c-text-3)}
#setup input:hover{border-color:var(--c-text-3)}
#setup input:focus-visible,#setup select:focus-visible{border-color:var(--c-accent);box-shadow:0 0 0 4px var(--c-accent-soft)}
#setup [aria-invalid="true"]{border-color:var(--c-bad)}
#setup .su-num-in{width:80px;min-width:0;min-height:36px;padding:0 10px;text-align:right}
.su-tog-r .su-num-in{flex:none}
/* chip: 24px pill with a dot in its tone */
.su-chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-pill);background:var(--c-surface-2);color:var(--c-text-2);font-size:12px;line-height:16px;font-weight:500;white-space:nowrap;flex:none}
.su-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.su-chip.ok{background:var(--c-ok-soft);color:var(--c-ok)}
.su-chip.wait{background:var(--c-warn-soft);color:var(--c-warn)}
.su-chip.bad{background:var(--c-bad-soft);color:var(--c-bad)}
.su-chip.mut{background:var(--c-surface-2);color:var(--c-text-2)}
/* inline alert: soft fill, 3px tone border, 20px icon. At most one per camera. */
.su-alert{--tone:var(--c-line-strong);--tone-soft:var(--c-surface-2);display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:12px;align-items:start;margin:0;padding:12px 16px;border-radius:var(--r-md);border-left:3px solid var(--tone);background:var(--tone-soft);color:var(--c-text);font-size:14px;line-height:20px}
.su-alert.ok{--tone:var(--c-ok);--tone-soft:var(--c-ok-soft)}
.su-alert.warn{--tone:var(--c-warn);--tone-soft:var(--c-warn-soft)}
.su-alert.bad{--tone:var(--c-bad);--tone-soft:var(--c-bad-soft)}
.su-alert>.su-ico{color:var(--tone)}
.su-alert-body{display:grid;gap:var(--s-2);min-width:0}
.su-alert-body p{font-size:14px;line-height:20px;color:var(--c-text);overflow-wrap:anywhere}
.su-alert-t{font-weight:600}
/* the sign-in wait: a 4px bar that drains over the wait */
.su-bar-track{height:4px;border-radius:2px;background:var(--c-line);overflow:hidden}
.su-bar-fill{height:100%;background:var(--c-warn);transform-origin:left center;transform:scaleX(var(--frac,1));transition:transform 1s linear}
/* checklist, prerequisite rows, privacy line, disclosures (Prepare) */
.su-checklist{display:grid;gap:var(--s-3);list-style:none;margin:0;padding:0}
.su-checklist li{display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:var(--s-3);align-items:start}
.su-checklist strong{display:block;font-size:15px;line-height:22px;font-weight:600}
.su-checklist .su-detail{display:block}
.su-num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--c-accent-soft);color:var(--c-accent-text);font-size:14px;font-weight:600}
.su-status-rows{border:1px solid var(--c-line);border-radius:var(--r-md);background:var(--c-surface);list-style:none}
.su-status-rows>li{padding:12px 16px}
.su-status-rows>li+li{border-top:1px solid var(--c-line)}
.su-srow-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3)}
.su-srow-main{display:flex;align-items:center;gap:10px;min-width:0;font-size:15px;line-height:22px;overflow-wrap:anywhere}
.su-srow-top .su-detail{margin-top:var(--s-1)}
.su-privacy{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:20px;color:var(--c-text-2)}
.su-privacy .su-ico{color:var(--c-accent-text)}
.su-more{border-top:1px solid var(--c-line)}
.su-more details{border-bottom:1px solid var(--c-line)}
.su-more summary,.su-more-d>summary{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);min-height:44px;font-size:15px;line-height:22px;font-weight:500;color:var(--c-text)}
.su-more summary:focus-visible,.su-more-d>summary:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
.su-chev{color:var(--c-text-2);transition:transform var(--t-base) var(--ease)}
details[open]>summary>.su-chev{transform:rotate(90deg)}
.su-more-body{padding:0 0 var(--s-4);font-size:14px;line-height:22px;color:var(--c-text);max-width:60ch}
/* the one disclosure of a camera pane and the reachability details of a wizard row */
.su-more-d{border-top:1px solid var(--c-line)}
.su-more-d>.su-more-body{padding:0 var(--s-5) var(--s-4)}
/* cards: wizard rows, verify cards, and the Settings boxes (saved-credential rows inside) */
.su-card-s{display:flex;flex-direction:column;min-width:0;border:1px solid var(--c-line);border-radius:var(--r-lg);background:var(--c-surface);overflow-wrap:anywhere}
.su-pad{padding:var(--s-5);gap:var(--s-4)}
.su-line{padding:14px var(--s-5)}
.su-danger{border-color:color-mix(in srgb,var(--c-bad) 40%,transparent)}
.su-cam-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:var(--s-3)}
.su-cam-tools{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2)}
.su-cam-tools .su-btn{min-height:36px;--su-pad-x:12px;font-size:14px}
.su-card-s .su-meta{margin-top:calc(var(--s-2) - var(--s-4))}
/* saved-credential row: label, value, action; the rows of one box are divided by a 1px rule */
.su-cred{display:grid;grid-template-columns:160px minmax(0,1fr) auto;align-items:center;gap:var(--s-2) var(--s-4);padding:14px var(--s-5);border-top:1px solid var(--c-line)}
.su-cred{min-height:56px;padding-block:10px}
.su-card-s>.su-cred:first-child,.su-card-s>.su-tog:first-child{border-top:0}
.su-cred-wide{grid-template-columns:160px minmax(0,1fr);align-items:start}
.su-cred-solo{grid-template-columns:minmax(0,1fr) auto}
.su-cred-l{font-size:14px;line-height:20px;color:var(--c-text-2)}
.su-cred-v{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2);min-width:0;font-size:15px;line-height:22px;color:var(--c-text);overflow-wrap:anywhere}
.su-cred-a{display:flex;align-items:center;justify-content:flex-end;gap:var(--s-2)}
.su-cred-chip{display:inline-flex;flex-wrap:wrap;align-items:center;gap:var(--s-2)}
.su-cred-note{padding:0 var(--s-5) 14px;font-size:14px;line-height:20px}
.su-cred-note.su-bad{color:var(--c-bad)}
.su-mask{letter-spacing:.14em;color:var(--c-text-2)}
.su-saved{font-size:13px;line-height:18px;color:var(--c-ok)}
/* toggles and numbers in Playback: 44px rows, value on the right */
.su-tog{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:var(--s-2) var(--s-4);min-height:44px;padding:10px var(--s-5);border-top:1px solid var(--c-line)}
.su-tog-l{font-size:15px;line-height:22px}
.su-tog>.su-err{grid-column:1/-1}
.su-tog-r{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:var(--s-2)}
/* the switch is 36x20; its ::before extends the hit area to 44x44 */
.su-switch{position:relative;flex:none;width:36px;height:20px;padding:0;border:0;border-radius:10px;background:var(--c-line-strong);cursor:pointer;transition:background var(--t-fast) var(--ease)}
.su-switch::before{content:"";position:absolute;inset:-12px -4px}
.su-switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--c-on-accent);transition:transform var(--t-fast) var(--ease)}
.su-switch[aria-checked="true"]{background:var(--c-accent)}
.su-switch[aria-checked="true"]::after{transform:translateX(16px)}
.su-dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s-2) var(--s-4);font-size:14px;line-height:20px}
.su-dl dt{color:var(--c-text-2)}
.su-dl dd{overflow-wrap:anywhere}
/* Settings: sidebar (280px) and one detail pane; the pane is at most 720px wide */
.su-set{display:grid;grid-template-columns:280px minmax(0,1fr);column-gap:40px;align-items:start;max-width:1120px;margin:0 auto;padding:32px 32px 48px}
.su-side{position:sticky;top:96px;display:flex;flex-direction:column;gap:var(--s-6);min-width:0}
.su-grp{display:flex;flex-direction:column;gap:4px;min-width:0}
.su-grp-h{margin:0 0 var(--s-2);font-size:12px;line-height:16px;font-weight:600;color:var(--c-text-3)}
.su-row{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:var(--r-md);background:transparent;color:var(--c-text);text-align:left;cursor:pointer;font-size:15px;line-height:20px;font-weight:500}
.su-row-cam{min-height:52px;padding-block:8px}
.su-row:hover{background:var(--c-surface-2)}
.su-row[aria-current="page"]{background:var(--c-accent-soft);color:var(--c-accent-text);font-weight:600;box-shadow:inset 3px 0 0 var(--c-accent)}
.su-row-wrap{position:relative}
.su-row-mv-pad{padding-right:84px}
.su-row-mv{position:absolute;top:50%;right:8px;display:flex;gap:2px;transform:translateY(-50%)}
.su-mv{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border:0;border-radius:var(--r-sm);background:transparent;color:var(--c-accent-text);cursor:pointer}
.su-mv:hover:not(:disabled){background:var(--c-surface)}
.su-mv:disabled{color:var(--c-text-3);opacity:.45;cursor:default}
.su-row-chev{margin-inline-start:auto;color:var(--c-text-2)}
.su-row-main{display:flex;flex-direction:column;min-width:0;flex:1}
.su-row-name{overflow-wrap:anywhere}
.su-row-sub{font-size:13px;line-height:16px;font-weight:400;color:var(--c-text-2)}
.su-row-ico{color:var(--c-accent-text)}
.su-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c-text-3)}
.su-dot.ok{background:var(--c-ok)}
.su-dot.wait{background:var(--c-warn)}
.su-dot.bad{background:var(--c-bad)}
.su-pane{min-width:0;max-width:720px}
.su-pane-in{display:flex;flex-direction:column;gap:var(--s-7);min-width:0}
.su-ident{display:flex;flex-direction:column;gap:var(--s-4);min-width:0}
.su-id{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s-3)}
.su-id-main{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2);min-width:0}
.su-id-name{font-size:24px;line-height:30px;font-weight:600;overflow-wrap:anywhere}
.su-id-r{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:var(--s-2)}
.su-sec{display:flex;flex-direction:column;gap:var(--s-3);min-width:0}
.su-sec-h{font-size:15px;line-height:20px;font-weight:600}
.su-seg-group{display:inline-flex;flex-wrap:wrap;gap:4px;padding:3px;border:1px solid var(--c-line);border-radius:var(--r-md);background:var(--c-surface-2)}
.su-seg-btn{min-height:36px;padding:0 12px;border:1px solid transparent;border-radius:var(--r-sm);background:transparent;color:var(--c-text-2);font-size:14px;font-weight:500;cursor:pointer}
.su-seg-btn[aria-pressed="true"],.su-seg-btn[aria-checked="true"]{background:var(--c-surface);border:1px solid var(--c-line-strong);color:var(--c-text);font-weight:600}
/* footer: a rule, 24px above the buttons. Back (or a secondary) on the left, the actions on the right */
#setupfoot{position:sticky;bottom:0;z-index:2;margin:var(--s-6) calc(-1 * var(--s-7)) calc(-1 * var(--s-7));padding:var(--s-5) var(--s-7);background:var(--c-surface);border-top:1px solid var(--c-line);border-radius:0 0 calc(var(--r-lg) - 1px) calc(var(--r-lg) - 1px)}
#setupfoot:empty{display:none}
.su-nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s-2)}
.su-nav-l{display:flex;align-items:center;min-width:0}
.su-nav-r{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:var(--s-2);min-width:0;margin-left:auto}
/* confirm dialog (400px, 24px padding) and the one toast of the page */
.su-dlg{box-sizing:border-box;width:min(400px,calc(100% - 48px));max-width:400px;padding:var(--s-6);border:1px solid var(--c-line);border-radius:var(--r-lg);background:var(--c-surface);color:var(--c-text);box-shadow:var(--e-1)}
.su-dlg::backdrop{background:rgba(0,0,0,.45)}
.su-dlg-t{font-size:17px;line-height:24px;font-weight:600}
.su-dlg-b{margin-top:var(--s-2);font-size:15px;line-height:22px;color:var(--c-text-2)}
.su-dlg-act{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--s-2);margin-top:var(--s-6)}
.su-toast{position:fixed;left:50%;bottom:16px;z-index:30;transform:translateX(-50%);box-sizing:border-box;display:flex;align-items:center;gap:var(--s-3);width:max-content;max-width:min(400px,calc(100% - 32px));padding:10px 12px 10px 16px;border-radius:var(--r-md);background:var(--c-surface-2);border:1px solid var(--c-line-strong);color:var(--c-text);font-size:14px;line-height:20px;box-shadow:var(--e-1)}
.su-toast:empty{display:none}

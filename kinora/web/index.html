<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Kinora</title>
<link rel="stylesheet" href="/static/m3.css?v=2"><link rel="stylesheet" href="/static/app.css?v=2"></head><body><div id="app">
<header class="pb-bar" role="banner">
  <div class="pb-brand"><svg class="pb-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect class="pb-mk-b" x="3" y="3" width="14" height="14" rx="4"/><rect class="pb-mk-f" x="7" y="7" width="14" height="14" rx="4"/></svg><span class="pb-name">Kinora</span></div>
  <nav class="pb-switch" aria-label="Cameras"><button class="pb-camsel" id="camsel" type="button" aria-haspopup="dialog" aria-controls="camsheet"><span id="camname">Cameras</span><span class="pb-chev" aria-hidden="true">▾</span></button><div id="chips" role="tablist" aria-label="Cameras"></div></nav>
  <button class="pb-btn ghost" id="addcam" type="button" title="Add a camera" aria-label="Add camera"><svg class="pb-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg></button>
  <div class="pb-bar-r">
    <button class="pb-btn pb-theme" id="themebtn" type="button" aria-label="Theme" title="Theme"><svg class="pb-ico" data-i="auto" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v3M8.5 19.5h7"/></svg><svg class="pb-ico" data-i="sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg><svg class="pb-ico" data-i="moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    <span class="pb-sr" id="themestatus" role="status"></span>
    <button class="pb-btn pb-settings" id="settingsbtn" type="button" aria-label="Settings" title="Settings"><svg class="pb-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
</header>
<div id="cols">
<main>
<div id="vwrap"><video id="v" controls playsinline></video><canvas id="freeze"></canvas><div id="msg" aria-live="polite"></div>
  <div id="ptz" title="Pan / tilt the camera (hold to keep moving)">
    <button data-d="up" aria-label="Tilt up"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button><button data-d="left" aria-label="Pan left"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><span class="c"></span><button data-d="right" aria-label="Pan right"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button><button data-d="down" aria-label="Tilt down"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
  <div id="ptzside">
    <div id="ptzpre"><button id="ptzpbtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="ptzplist" title="Go to one of the camera's saved presets (made in the Tapo app)">Presets</button>
      <div id="ptzplist" role="menu" aria-label="Saved presets" hidden></div></div>
    <div id="ptzmsg"></div>
  </div>
</div>
<div id="ctl" class="pb-card">
<div class="bar">
  <div class="pb-seg" id="modeseg" role="radiogroup" aria-label="View">
    <button class="pb-seg-btn" id="live" type="button" role="radio" aria-checked="true" data-tip="Watching live. This is what the camera sees right now." aria-description="Watching live. This is what the camera sees right now."><svg class="pb-mode-dot" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="6"/></svg>Live</button>
    <button class="pb-seg-btn" id="recbtn" type="button" role="radio" aria-checked="false" tabindex="-1" data-tip="Playing back what the camera saved to its SD card. Pick a time on the timeline or an event." aria-description="Playing back what the camera saved to its SD card. Pick a time on the timeline or an event."><svg class="pb-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 6v12l10-6z"/></svg>Recordings</button>
  </div>
  <button class="pb-sound" id="sound" type="button" aria-label="Sound" aria-pressed="false" data-tip="Sound off" hidden><svg class="pb-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="pb-snd-on" d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/><path class="pb-snd-off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
  <div class="pb-speed"><span class="pb-cap" id="speedlbl" data-tip="Playback speed for recordings.">Speed</span><div id="speed" class="pb-seg live" aria-disabled="true" role="group" aria-label="Playback speed" aria-description="Playback speed for recordings.">
    <button class="pb-seg-btn on" data-r="1" type="button" aria-pressed="true" data-tip="Normal speed">1×</button><button class="pb-seg-btn" data-r="2" type="button" aria-pressed="false" data-tip="Faster: 2x">2×</button><button class="pb-seg-btn" data-r="4" type="button" aria-pressed="false" data-tip="Faster: 4x">4×</button><button class="pb-seg-btn" data-r="8" type="button" aria-pressed="false" data-tip="Faster: 8x. Skips ahead using key frames">8×</button><button class="pb-seg-btn" data-r="16" type="button" aria-pressed="false" data-tip="Faster: 16x. Skips ahead using key frames">16×</button>
  </div></div>
  <div class="tx-r">
    <div class="date"><button id="prev" type="button" aria-label="Previous day"><svg class="pb-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 6l-6 6 6 6"/></svg></button><button class="d" id="dlabel" type="button">Today</button><input type="date" id="date"><button id="next" type="button" aria-label="Next day"><svg class="pb-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6l6 6-6 6"/></svg></button></div>
    <button class="pb-btn pb-filled" id="exportbtn" type="button" aria-label="Export" title="Save a time range as video or audio"><svg class="pb-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Export</button>
  </div>
</div>
<div id="camstat" role="alert"></div>
<div id="livestat" class="pb-status t-mut" role="status" aria-live="polite" hidden></div>
<div id="tlwrap"><div id="bubble">--:--:--</div><canvas id="cv" role="slider" tabindex="0" aria-label="Playback time" aria-valuemin="0" aria-valuemax="86399" aria-valuenow="0" aria-valuetext="--:--:--"></canvas><div id="head"></div></div>
</div>
</main>
<aside id="evpanel" aria-labelledby="evh">
<button id="evpeek" class="ev-peek" type="button" aria-expanded="false" aria-controls="evs">Events · <span id="evpeekn">0</span></button>
<div id="evhead">
<div class="ev-top"><h3 id="evh">Events</h3><span class="pb-count" id="evcount"></span><button id="evrefresh" aria-label="Refresh events" title="Refresh events"><svg class="ic-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-15.5-6.3L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15.5 6.3L21 16"/><path d="M16 16h5v5"/></svg><svg class="ic-load" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></svg></button></div>
<div id="filters" role="group" aria-label="Filter events by type"><span class="chsk w1"></span><span class="chsk w2"></span><span class="chsk w3"></span></div>
</div>
<div id="evs"><span class="pb-sr" role="status">Loading events…</span><div class="evsk"></div><div class="evsk"></div><div class="evsk"></div><div class="evsk"></div><div class="evsk"></div></div>
</aside>
</div>
</div>
<section id="setup" hidden aria-labelledby="setuptitle">
  <div id="suwrap">
    <header class="su-top" id="sutop">
      <button class="su-btn ghost su-back" id="setupback" type="button" hidden></button>
      <div class="su-brand"><span id="sumark"></span><h1 class="su-appname" id="setuptitle">Camera setup</h1></div>
    </header>
    <nav id="sunav" aria-label="Setup steps" hidden></nav>
    <div id="setupmain"></div>
    <div class="su-foot" id="setupfoot"></div>
  </div>
  <div class="su-toast" id="sutoast" role="status" aria-live="polite"></div>
  <dialog class="su-dlg" id="suconfirm" aria-labelledby="suconfirmt"></dialog>
</section>
<dialog id="camsheet" class="sheet" aria-labelledby="camsheeth">
  <h2 id="camsheeth">Cameras</h2>
  <div id="camlist"></div>
  <hr class="pb-sep" role="separator">
  <button class="pb-mi" id="sheetadd" type="button">+ Add camera</button>
</dialog>
<dialog id="exp">
  <h2 id="exptitle">Export</h2>
  <label for="expstart">From</label><input type="datetime-local" step="1" id="expstart">
  <label for="expend">To</label><input type="datetime-local" step="1" id="expend">
  <label for="expmode">Format</label>
  <select id="expmode">
    <option value="video">Video + audio (MP4)</option>
    <option value="audio_wav">Audio only: WAV, 16 kHz mono (for speech recognition)</option>
    <option value="audio_m4a">Audio only: M4A (small, for listening)</option>
  </select>
  <div id="expmsg"></div><progress id="expbar" max="1" value="0"></progress><div id="explinks"></div>
  <div class="row"><button id="expcancel">Close</button><button class="go pb-filled" id="expgo">Export</button></div>
</dialog>
<script src="/static/hls.min.js"></script>
<script src="/static/app.js?v=71"></script>
<script src="/static/setup.js?v=19"></script></body></html>

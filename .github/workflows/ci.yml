name: ci

on:
  push:
  pull_request:

jobs:
  offline-tests:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Native Windows is v1.1 and not tested here; the wsl-smoke job covers Windows via WSL
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
        # macOS runners are scarce (concurrency cap): only the oldest supported Python there, ubuntu covers the rest
        exclude:
          - os: macos-latest
            python: "3.12"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      # The suite is offline (no camera, no ffmpeg needed). run_all.sh is POSIX sh: bash (git bash on Windows).
      - name: Run offline tests
        shell: bash
        env:
          PY: python
        run: sh tests/run_all.sh

  # Build the wheel, install it in a clean venv and fetch the UI from a real `kinora` process (127.0.0.1, temp home).
  package-smoke:
    name: package-smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Package smoke test
        shell: bash
        env:
          PY: python
        run: |
          python -m pip install build
          sh tests/package_smoke.sh

  # The README tells Windows users to run Kinora under WSL as Linux: check that path works.
  wsl-smoke:
    name: package-smoke / windows WSL (Ubuntu)
    runs-on: windows-latest
    timeout-minutes: 15
    # Reported, not blocking, same as the native Windows job
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-24.04
          additional-packages: python3 python3-venv python3-pip ffmpeg
      - name: Package smoke test (inside WSL)
        shell: wsl-bash {0}
        env:
          PY: python3
        run: |
          python3 -m venv /tmp/buildenv
          /tmp/buildenv/bin/pip install build
          PY=/tmp/buildenv/bin/python sh tests/package_smoke.sh
